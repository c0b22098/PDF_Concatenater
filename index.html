<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF検証・自動結合ツール</title>
    
    <script src="https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.min.js"
        integrity="sha384-/1qUCSGwTur9vjf/z9lmu/eCUYbpOTgSjmpbMQZ1/CtX2v/WcAIKqRv+U1DUCG6e"
        crossorigin="anonymous"></script>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"
        integrity="sha384-weMABwrltA6jWR8DDe9Jp5blk+tZQh7ugpCsF3JwSA53WZM9/14PjS5LAJNHNjAI"
        crossorigin="anonymous"></script>

    <style>
        body { font-family: sans-serif; padding: 2rem; background-color: #f4f4f9; color: #333; line-height: 1.6; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        
        h2, h3 { color: #2c3e50; border-bottom: 2px solid #eee; padding-bottom: 0.5rem; }
        
        .regex-section { margin-bottom: 2rem; background: #fafafa; padding: 1rem; border-radius: 8px; border: 1px solid #ddd; }
        .regex-item { padding: 0.5rem; background: white; border: 1px solid #ccc; margin-bottom: 0.5rem; border-radius: 4px; }
        .regex-item-main { display: flex; align-items: center; gap: 0.5rem; font-family: monospace; }
        .regex-item .status { font-weight: bold; padding: 0.2rem 0.6rem; border-radius: 12px; font-size: 0.85rem; font-family: sans-serif; flex-shrink: 0; }
        .status.unmet { background: #ffebee; color: #c62828; }
        .status.met { background: #e8f5e9; color: #2e7d32; }
        .pattern { word-break: break-all; }
        .pattern-desc { font-family: sans-serif; font-size: 0.85rem; color: #555; margin-top: 0.35rem; }
        .list-info { font-weight: bold; color: #1565c0; margin: 0 0 0.75rem; }
        .list-info.invalid { color: #c62828; }

        #drop-zone { border: 2px dashed #999; border-radius: 8px; padding: 3rem; text-align: center; color: #666; transition: all 0.2s ease; cursor: pointer; background: #fff; }
        #drop-zone.dragover { border-color: #2196F3; background-color: #e3f2fd; color: #2196F3; }
        
        .file-list { list-style: none; padding: 0; margin: 1rem 0; }
        /* 🌟 ファイルアイテムのレイアウトを調整（削除ボタンを右に寄せるため） */
        .file-item { display: flex; justify-content: space-between; align-items: flex-start; padding: 1rem; border: 1px solid #ddd; margin-bottom: 0.5rem; border-radius: 4px; background: white; }
        .file-details { flex-grow: 1; margin-right: 1rem; }
        .file-info { font-weight: bold; margin-bottom: 0.25rem; }
        .url-info { font-size: 0.9rem; color: #555; word-break: break-all; }
        .match-badge { display: inline-block; padding: 0.2rem 0.5rem; border-radius: 4px; font-size: 0.8rem; margin-top: 0.5rem; font-weight: bold; }
        .match-success { background: #e3f2fd; color: #1565c0; border: 1px solid #bbdefb; }
        .match-error { background: #ffebee; color: #c62828; border: 1px solid #ffcdd2; }
        
        button { padding: 0.5rem 1rem; background-color: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #45a049; }
        /* 🌟 削除ボタンのデザイン */
        button.btn-danger { background-color: #f44336; padding: 0.3rem 0.6rem; font-size: 0.85rem; }
        button.btn-danger:hover { background-color: #da190b; }
        button.btn-file-delete { margin-top: 0.2rem; }
        
        #merge-btn { width: 100%; padding: 1rem; font-size: 1.1rem; margin-top: 1rem; background-color: #2196F3; display: block; }
        #merge-btn:hover { background-color: #1976D2; }
        #merge-btn:disabled { background-color: #ccc; cursor: not-allowed; }
        
        #status-message { margin-top: 1rem; text-align: center; font-weight: bold; font-size: 1.1rem; }
    </style>
</head>
<body>

<div class="container">
    <h2>PDF検証・自動結合ツール</h2>
    <p>PDF内のURLを抽出し、条件に合致するかチェックします。<br>全てのPDFファイルが揃うと、<strong>条件リストの順番通りに結合</strong>してダウンロードできます。</p>

    <div class="regex-section">
        <h3>1. 結合条件</h3>
        <p id="list-info" class="list-info"></p>
        <div id="regex-list"></div>
    </div>

    <h3>2. PDFファイルの投入</h3>
    <div id="drop-zone" role="button" tabindex="0">
        ここに複数のPDFファイルをドラッグ＆ドロップ<br>またはクリックして選択
    </div>
    <input type="file" id="file-input" accept=".pdf" multiple style="display: none;">
    
    <ul id="file-list" class="file-list"></ul>

    <button id="merge-btn" disabled>条件に当てはまるPDFファイルが揃っていません（結合不可）</button>
    <div id="status-message"></div>
</div>

<script>
    // 絵文字アイコンはあくまで隣接するテキストを視覚的に補うだけの装飾であり、
    // 意味は直後のテキストがすべて伝えている。スクリーンリーダーが絵文字自体を
    // 読み上げて混乱しないよう aria-hidden="true" で隠す（見た目は変わらない）。
    //
    // 加えて、環境によっては絵文字の字形が用意されておらず表示できない
    // （文字化け・豆腐（□）表示になる）ことがあるため、label を渡した場合は
    // title 属性として設定する。ホバー時にブラウザ標準のツールチップとして
    // アイコンの意味を表示できるようにし、視覚的な代替テキストとする
    // （表示は変わらず、ホバーしたときだけ見える）。
    function withIcon(emoji, text, label) {
        const titleAttr = label ? ` title="${label}"` : '';
        return `<span aria-hidden="true"${titleAttr}>${emoji}</span> ${text}`;
    }

    // regex_config.js をキャッシュさせずに読み込む。
    // GitHub上で正規表現リストを更新したら、次回のページ読み込みで即座に反映されるようにするため、
    // 静的な <script src="regex_config.js"> ではなく、毎回異なるクエリ文字列を付けて動的に読み込む。
    function loadRegexConfig() {
        return new Promise((resolve, reject) => {
            const script = document.createElement('script');
            script.src = 'regex_config.js?v=' + Date.now();
            script.onload = resolve;
            script.onerror = () => reject(new Error('regex_config.js の読み込みに失敗しました'));
            document.head.appendChild(script);
        });
    }

    loadRegexConfig().then(initApp).catch((error) => {
        console.error(error);
        document.getElementById('status-message').innerHTML = withIcon('❌', '結合条件の読み込みに失敗しました。ページを再読み込みしてください。', 'エラー');
    });

    function initApp() {
    // 注: Worker生成にはブラウザ標準でSRI検証を適用できないため、
    // 上のpdf.min.jsと同じCDN・同一バージョンに固定して整合性リスクを最小化している。
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.worker.min.js';

    // 🌟 URLパラメータを取得する
    const urlParams = new URLSearchParams(window.location.search);
    const rawListId = urlParams.get('ex'); // URLが ?ex=5 なら "5" が入る

    // "ex" は1以上の整数（例: "5"）のみ有効とする。
    // "__proto__" 等の任意の文字列がオブジェクトのプロパティとして
    // 解釈されるのを防ぐため、数字のみの形式かつ実際にリストが
    // 存在する場合だけそのリストを使う。
    const isValidListId = rawListId !== null
        && /^[1-9][0-9]*$/.test(rawListId)
        && Object.prototype.hasOwnProperty.call(REGEX_LISTS, rawListId);

    // 有効な番号のリストを取得。指定がない、または無効な番号の場合は "default" を使う
    let targetList = isValidListId ? REGEX_LISTS[rawListId] : REGEX_LISTS["default"];

    // 🌟 画面上に「今どの回の条件を見ているか」を表示する
    const listInfoEl = document.getElementById('list-info');
    if (isValidListId) {
        listInfoEl.textContent = `第${rawListId}回用`;
        listInfoEl.classList.remove('invalid');
    } else {
        listInfoEl.innerHTML = withIcon('⚠️', '回数（exパラメータ）が指定されていないか無効なため、既定の条件を表示しています。', '警告');
        listInfoEl.classList.add('invalid');
    }

    // regex_config.js の各条件は { pattern, description } 形式を基本とするが、
    // 説明なしで文字列だけが書かれていた場合にも対応する。
    function normalizeCondition(entry) {
        if (typeof entry === 'string') {
            return { pattern: entry, description: '' };
        }
        return { pattern: entry.pattern, description: entry.description || '' };
    }

    // 外部ファイル(regex_config.js)からリストを読み込んで状態管理の配列を作る
    let regexConditions = targetList.map(entry => {
        const { pattern, description } = normalizeCondition(entry);
        return { pattern: pattern, description: description, matchedFile: null, extractedUrl: null };
    });
    let unmatchedFiles = []; 

    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');
    const regexListDiv = document.getElementById('regex-list');
    const fileListUl = document.getElementById('file-list');
    const mergeBtn = document.getElementById('merge-btn');
    const statusMsg = document.getElementById('status-message');

    // ファイル名・PDF抽出URLなど外部由来の文字列をHTMLとして解釈させないためのエスケープ処理（XSS対策）
    function escapeHtml(str) {
        return String(str).replace(/[&<>"']/g, (ch) => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[ch]));
    }

    function render() {
        regexListDiv.innerHTML = '';
        let metCount = 0;

        regexConditions.forEach((cond, index) => {
            const isMet = cond.matchedFile !== null;
            if (isMet) metCount++;
            
            const div = document.createElement('div');
            div.className = 'regex-item';
            div.innerHTML = `
                <div class="regex-item-main">
                    <span class="status ${isMet ? 'met' : 'unmet'}">${isMet ? withIcon('✅', '確認済み', '確認済み') : withIcon('❌', '未確認', '未確認')}</span>
                    <span class="pattern">${escapeHtml(cond.pattern)}</span>
                </div>
                ${cond.description ? `<div class="pattern-desc">${withIcon('📝', escapeHtml(cond.description), '説明')}</div>` : ''}
            `;
            regexListDiv.appendChild(div);
        });

        fileListUl.innerHTML = '';
        
        // 🌟 適合ファイルの描画（削除ボタン追加）
        regexConditions.forEach((cond, index) => {
            if (cond.matchedFile) {
                const li = document.createElement('li');
                li.className = 'file-item';
                li.innerHTML = `
                    <div class="file-details">
                        <div class="file-info">${withIcon('📄', escapeHtml(cond.matchedFile.name), 'ファイル')}</div>
                        <div class="url-info">${withIcon('🔗', '抽出URL: ' + escapeHtml(cond.extractedUrl), 'リンク')}</div>
                        <div class="match-badge match-success">${withIcon('🎯', '条件合致: ' + (cond.description ? escapeHtml(cond.description) : escapeHtml(cond.pattern)), '条件合致')}</div>
                        ${cond.description ? `<div class="pattern-desc">（${escapeHtml(cond.pattern)}）</div>` : ''}
                    </div>
                    <button class="btn-danger btn-file-delete" onclick="removeMatchedFile(${index})">${withIcon('✕', '削除', '削除')}</button>
                `;
                fileListUl.appendChild(li);
            }
        });

        // 🌟 不適合ファイルの描画（削除ボタン追加）
        unmatchedFiles.forEach((item, index) => {
            const li = document.createElement('li');
            li.className = 'file-item';
            li.innerHTML = `
                <div class="file-details">
                    <div class="file-info">${withIcon('📄', escapeHtml(item.file.name), 'ファイル')}</div>
                    <div class="url-info">${withIcon('🔗', '抽出URL: ' + (item.url ? escapeHtml(item.url) : 'URLが見つかりません'), 'リンク')}</div>
                    <div class="match-badge match-error">${withIcon('⚠️', '不適合ファイル', '警告')}</div>
                </div>
                <button class="btn-danger btn-file-delete" onclick="removeUnmatchedFile(${index})">${withIcon('✕', '削除', '削除')}</button>
            `;
            fileListUl.appendChild(li);
        });

        const isReady = regexConditions.length > 0 && metCount === regexConditions.length;
        if (isReady) {
            mergeBtn.disabled = false;
            mergeBtn.innerHTML = withIcon('✅', 'PDFを結合してダウンロード', '準備完了');
        } else {
            mergeBtn.disabled = true;
            mergeBtn.innerText = `条件に当てはまるPDFファイルが揃っていません（${metCount} / ${regexConditions.length}）`;
        }
    }

    // 🌟 適合ファイルをリストから外す処理
    window.removeMatchedFile = function(index) {
        regexConditions[index].matchedFile = null;
        regexConditions[index].extractedUrl = null;
        render(); // 画面を再描画して結合ボタンの判定などをやり直す
    }

    // 🌟 不適合ファイルをリストから削除する処理
    window.removeUnmatchedFile = function(index) {
        unmatchedFiles.splice(index, 1);
        render();
    }

    dropZone.addEventListener('click', () => fileInput.click());
    // 🌟 キーボード操作（Tabでフォーカス→Enter/Spaceで選択）に対応
    dropZone.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') {
            e.preventDefault();
            fileInput.click();
        }
    });
    fileInput.addEventListener('change', (e) => processFiles(e.target.files));
    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
        processFiles(e.dataTransfer.files);
    });

    async function processFiles(files) {
        statusMsg.innerHTML = withIcon('🔍', 'PDFを解析中...', '処理中');
        statusMsg.style.color = '#333';

        for (let file of files) {
            if (file.type !== 'application/pdf') continue;

            try {
                const firstUrl = await extractUrlFromPdf(file);
                let matched = false;
                
                if (firstUrl) {
                    for (let cond of regexConditions) {
                        const regex = new RegExp(cond.pattern);
                        if (regex.test(firstUrl)) {
                            cond.matchedFile = file;
                            cond.extractedUrl = firstUrl;
                            matched = true;
                            break; 
                        }
                    }
                }

                if (!matched) {
                    unmatchedFiles.push({ file: file, url: firstUrl });
                }

            } catch (error) {
                console.error('PDF解析エラー:', error);
                unmatchedFiles.push({ file: file, url: '解析エラー（暗号化等）' });
            }
        }
        
        fileInput.value = '';
        statusMsg.innerText = '';
        render();
    }

    // Chromeなどのブラウザで「ヘッダーとフッター」を有効にして印刷（PDF保存）すると、
    // 各ページ下端の余白に「印刷元ページのURL」が全ページ共通で印字される。
    // このフッターは本文の内容に関わらず全ページで同一のため、
    //   1. ページ下端の余白内（印刷フッターの位置）にあるテキストだけを対象にURLを探す
    //   2. 全ページ分の候補を集計し、最も多くのページで一致したURLを採用する（多数決）
    // という手順にすることで、本文中に別のURL（README内のリンクなど）が
    // 偶然含まれていても、それに惑わされず印刷元のURLを正しく特定できる。
    // フッターにURLが見つからない場合（印刷時に「ヘッダーとフッター」がOFF等）は、
    // 従来通りページ本文全体から最初に見つかったURLにフォールバックする。
    const URL_REGEX = /https?:\/\/[^\s]+/i;
    const FOOTER_MARGIN_PT = 40; // Chrome既定の印刷余白(0.4in=28.8pt)を少し超える範囲

    async function extractUrlFromPdf(file) {
        const arrayBuffer = await file.arrayBuffer();
        const loadingTask = pdfjsLib.getDocument({ data: arrayBuffer });
        const pdf = await loadingTask.promise;

        const footerUrlVotes = new Map();
        let wholeText = '';

        for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
            const page = await pdf.getPage(pageNum);
            const textContent = await page.getTextContent();

            // item.transform[5] はページ下端からの距離（PDF座標系はY軸が上向き）。
            // これが小さい（ページ下端に近い）テキストだけを印刷フッターとみなす。
            const footerText = textContent.items
                .filter(item => item.transform[5] <= FOOTER_MARGIN_PT)
                .sort((a, b) => a.transform[4] - b.transform[4]) // 左から右の順に並べ替え
                .map(item => item.str)
                .join('');
            const footerMatch = footerText.match(URL_REGEX);
            if (footerMatch) {
                footerUrlVotes.set(footerMatch[0], (footerUrlVotes.get(footerMatch[0]) || 0) + 1);
            }

            wholeText += textContent.items.map(item => item.str).join(' ') + ' ';
        }

        if (footerUrlVotes.size > 0) {
            const [bestUrl] = [...footerUrlVotes.entries()].sort((a, b) => b[1] - a[1])[0];
            return bestUrl;
        }

        // フォールバック: フッターにURLが見つからない場合は本文全体から探す
        const wholeMatch = wholeText.match(URL_REGEX);
        return wholeMatch ? wholeMatch[0] : null;
    }

    mergeBtn.addEventListener('click', async () => {
        statusMsg.innerHTML = withIcon('⚙️', '結合処理を実行中...', '処理中');
        statusMsg.style.color = '#333';
        mergeBtn.disabled = true;

        try {
            // 🌟 1. pdf-lib から文字を描画するための追加ツールを読み込む
            const { PDFDocument, rgb, degrees, StandardFonts } = PDFLib;
            const mergedPdf = await PDFDocument.create();

            // （これまでの結合処理）順番通りにファイルを結合する
            for (let cond of regexConditions) {
                if (!cond.matchedFile) continue; 

                const arrayBuffer = await cond.matchedFile.arrayBuffer();
                const pdf = await PDFDocument.load(arrayBuffer);
                const copiedPages = await mergedPdf.copyPages(pdf, pdf.getPageIndices());
                copiedPages.forEach((page) => mergedPdf.addPage(page));
            }

            // 🌟 2. ここから追加：最後のページに透かしを入れる処理 🌟
            const pages = mergedPdf.getPages();
            if (pages.length > 0) {
                // 最後のページを取得
                const lastPage = pages[pages.length - 1];
                // ページの幅と高さを取得（中央に配置するため）
                const { width, height } = lastPage.getSize();
                
                // 標準フォントを埋め込む（英数字用）
                const font = await mergedPdf.embedFont(StandardFonts.HelveticaBold);

                // 透かしのテキストを描画
                lastPage.drawText('VERIFIED', {
                    x: width - 100,       // 横位置（適宜調整）
                    y: 15,       // 縦位置（適宜調整）
                    size: 10,                 // 文字のサイズ
                    font: font,               // フォント
                    color: rgb(0.9, 0.2, 0.2),// 色（赤っぽく設定）
                    opacity: 0.3,             // 透明度（0.0〜1.0で指定、0.3で半透明）
                });
            }
            // 🌟 透かし処理ここまで 🌟

            const pdfBytes = await mergedPdf.save();
            const blob = new Blob([pdfBytes], { type: 'application/pdf' });
            const url = window.URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = 'C0XXXXXX_kadaiX.pdf';
            document.body.appendChild(a);
            a.click();
            a.remove();
            window.URL.revokeObjectURL(url);

            statusMsg.innerHTML = withIcon('✨', 'ダウンロードが完了しました！', '完了');
            statusMsg.style.color = '#2e7d32';

        } catch (error) {
            console.error(error);
            statusMsg.innerHTML = withIcon('❌', '結合処理中にエラーが発生しました。', 'エラー');
            statusMsg.style.color = '#c62828';
        } finally {
            render(); 
        }
    });

    render();
    } // initApp ここまで
</script>

</body>
</html>
